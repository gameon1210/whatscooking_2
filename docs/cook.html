<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today's menu</title>
<meta name="robots" content="noindex" />
<style>
  :root { --bg:#FFF8F1; --card:#fff; --text:#1F1A17; --muted:#6B625B; --border:#EADFD5; --primary:#C2410C; --soft:#FFE3CC; --good:#2B8A3E; --goodsoft:#E3F5E6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14100D; --card:#1F1915; --text:#F6EFE8; --muted:#B3A89E; --border:#3A302A; --primary:#FF8A3D; --soft:#4A2A14; --good:#69DB7C; --goodsoft:#1E3323; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font: 18px/1.45 system-ui, -apple-system, "Noto Sans", "Noto Sans Kannada", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Devanagari", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 26px; margin: 8px 0 2px; }
  .muted { color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 14px 0; }
  .slot { font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 14px 18px; min-height: 52px; cursor: pointer; }
  .opt { display:flex; width:100%; text-align:left; gap:10px; align-items:center; background: var(--soft); color: var(--text); margin: 6px 0; border-radius: 14px; border: 2px solid transparent; }
  .opt.sel { border-color: var(--good); background: var(--goodsoft); }
  .opt .rank { font-size: 14px; color: var(--muted); min-width: 92px; }
  .row { display:flex; gap:8px; flex-wrap: wrap; margin-top: 8px; }
  .ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
  .ghost.on { background: var(--primary); color: #fff; }
  input { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-top: 8px; }
  .qty { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .send { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border); }
  .send button { width: 100%; background: #25D366; color: #06240f; font-weight: 800; font-size: 19px; }
  .top { display:flex; justify-content: space-between; align-items:center; gap: 8px; }
  .listen { background: var(--soft); color: var(--primary); font-weight: 700; }
  .stop { background: none; color: var(--muted); font-size: 14px; text-decoration: underline; min-height: 0; padding: 8px 0; }
  .err { padding: 24px; text-align:center; }
</style>
</head>
<body>
<main id="app"></main>
<div class="send" id="sendbar" hidden><button id="send"></button></div>
<script>
(function () {
  var S = {
    en: { pick: 'I will make', first: '1st choice', second: '2nd choice', backup: 'Backup', missing: 'Something missing', change: 'Please change this', missingPh: 'What is missing? e.g. tomato, paneer', send: 'Send reply on WhatsApp', listen: '🔊 Listen', stop: 'Stop these messages', people: 'people', for: 'for', ok: 'OK', bad: 'This link looks broken. Please ask for a new one.' },
    hi: { pick: 'मैं बनाऊँगी', first: 'पहली पसंद', second: 'दूसरी पसंद', backup: 'बैकअप', missing: 'कुछ सामान नहीं है', change: 'कृपया बदलें', missingPh: 'क्या नहीं है? जैसे टमाटर, पनीर', send: 'WhatsApp पर जवाब भेजें', listen: '🔊 सुनें', stop: 'ये मैसेज बंद करें', people: 'लोग', for: 'के लिए', ok: 'ठीक है', bad: 'यह लिंक ठीक नहीं है। नया लिंक माँगें।' },
    kn: { pick: 'ನಾನು ಮಾಡುತ್ತೇನೆ', first: 'ಮೊದಲ ಆಯ್ಕೆ', second: 'ಎರಡನೇ ಆಯ್ಕೆ', backup: 'ಬದಲಿ', missing: 'ಸಾಮಾನು ಇಲ್ಲ', change: 'ದಯವಿಟ್ಟು ಬದಲಾಯಿಸಿ', missingPh: 'ಏನು ಇಲ್ಲ? ಉದಾ: ಟೊಮೆಟೊ', send: 'WhatsApp ನಲ್ಲಿ ಉತ್ತರ ಕಳುಹಿಸಿ', listen: '🔊 ಕೇಳಿ', stop: 'ಈ ಸಂದೇಶಗಳನ್ನು ನಿಲ್ಲಿಸಿ', people: 'ಜನ', for: 'ಗೆ', ok: 'ಸರಿ', bad: 'ಈ ಲಿಂಕ್ ಸರಿಯಿಲ್ಲ. ಹೊಸ ಲಿಂಕ್ ಕೇಳಿ.' },
    ta: { pick: 'நான் செய்வேன்', first: 'முதல் தேர்வு', second: 'இரண்டாவது', backup: 'மாற்று', missing: 'பொருள் இல்லை', change: 'தயவுசெய்து மாற்றவும்', missingPh: 'என்ன இல்லை? எ.கா. தக்காளி', send: 'WhatsApp-ல் பதில் அனுப்பு', listen: '🔊 கேளுங்கள்', stop: 'இந்த செய்திகளை நிறுத்து', people: 'பேர்', for: 'க்கு', ok: 'சரி', bad: 'இந்த இணைப்பு சரியில்லை. புதிய இணைப்பு கேளுங்கள்.' },
    te: { pick: 'నేను చేస్తాను', first: 'మొదటి ఎంపిక', second: 'రెండవది', backup: 'బ్యాకప్', missing: 'సామాను లేదు', change: 'దయచేసి మార్చండి', missingPh: 'ఏమి లేదు? ఉదా: టమాటా', send: 'WhatsApp లో జవాబు పంపండి', listen: '🔊 వినండి', stop: 'ఈ సందేశాలు ఆపండి', people: 'మంది', for: 'కోసం', ok: 'సరే', bad: 'ఈ లింక్ సరిగా లేదు. కొత్త లింక్ అడగండి.' }
  };
  var TTS = { en: 'en-IN', hi: 'hi-IN', kn: 'kn-IN', ta: 'ta-IN', te: 'te-IN' };
  var app = document.getElementById('app');

  function decode(b64) {
    var s = b64.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'class') e.className = attrs[k]; else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  var data;
  try { data = decode((location.hash.match(/d=([^&]+)/) || [])[1] || ''); } catch (e) { data = null; }
  if (!data || !data.items) { app.appendChild(el('div', { class: 'err' }, [S.en.bad, el('br'), S.hi.bad, el('br'), S.kn.bad])); return; }

  var L = S[data.lang] || S.en;
  document.documentElement.lang = data.lang;
  var state = {};
  data.items.forEach(function (it) { state[it.k] = { pick: 1, missing: '', change: false }; });

  function render() {
    app.innerHTML = '';
    var listen = el('button', { class: 'listen', onclick: speak }, [L.listen]);
    app.appendChild(el('div', { class: 'top' }, [el('div', {}, [el('h1', {}, [data.cook + ' 👋']), el('div', { class: 'muted' }, [data.fam + ' · ' + data.date + ' · ' + data.n + ' ' + L.people])]), listen]));
    data.items.forEach(function (it) {
      var st = state[it.k];
      var card = el('div', { class: 'card' }, [el('div', { class: 'slot' }, [it.t + (it.w ? ' · ' + it.w + ' ' + L.for : '')])]);
      it.o.forEach(function (name, i) {
        var rank = [L.first, L.second, L.backup][i] || '';
        card.appendChild(el('button', { class: 'opt' + (st.pick === i + 1 && !st.change ? ' sel' : ''), onclick: function () { st.pick = i + 1; st.change = false; render(); } }, [el('span', { class: 'rank' }, [(st.pick === i + 1 && !st.change ? '✅ ' : '') + rank]), el('span', {}, [name])]));
      });
      if (it.q) card.appendChild(el('div', { class: 'qty' }, ['⚖️ ' + it.q]));
      var row = el('div', { class: 'row' }, [
        el('button', { class: 'ghost' + (st.missingOpen ? ' on' : ''), onclick: function () { st.missingOpen = !st.missingOpen; render(); } }, [L.missing]),
        el('button', { class: 'ghost' + (st.change ? ' on' : ''), onclick: function () { st.change = !st.change; render(); } }, [L.change])
      ]);
      card.appendChild(row);
      if (st.missingOpen) {
        var inp = el('input', { placeholder: L.missingPh, value: st.missing });
        inp.addEventListener('input', function () { st.missing = inp.value; });
        card.appendChild(inp);
      }
      app.appendChild(card);
    });
    app.appendChild(el('button', { class: 'stop', onclick: stop }, [L.stop]));
  }

  function speak() {
    if (!('speechSynthesis' in window)) return;
    var text = data.items.map(function (it) { var st = state[it.k]; return it.t + ': ' + (it.o[st.pick - 1] || it.o[0]); }).join('. ');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = TTS[data.lang] || 'en-IN';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function wa(text) {
    var url = 'https://wa.me/' + (data.ph || '') + '?text=' + encodeURIComponent(text);
    location.href = url;
  }

  function send() {
    var human = [], codes = ['WC:' + data.id];
    data.items.forEach(function (it) {
      var st = state[it.k];
      if (st.change) { human.push(it.t + ': ' + L.change); codes.push('#' + it.k + '=C'); }
      else { human.push(it.t + ': ' + it.o[st.pick - 1]); codes.push('#' + it.k + '=' + st.pick); }
      var miss = (st.missing || '').split(/[,،]/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (miss.length) { human.push('  ' + L.missing + ': ' + miss.join(', ')); codes.push('#' + it.k + '=M:' + encodeURIComponent(miss.join(','))); }
    });
    wa(L.ok + ' 👍\n' + human.join('\n') + '\n\n' + codes.join(' '));
  }

  function stop() { wa('WC:' + data.id + ' STOP'); }

  document.getElementById('send').textContent = L.send;
  document.getElementById('send').addEventListener('click', send);
  document.getElementById('sendbar').hidden = false;
  render();
})();
</script>
</body>
</html>
